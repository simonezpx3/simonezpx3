<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-label="Benchmark Highlights: 35B MoE 89.5 tok/s, 1M RAG 162.8 us, and 10M RAG 296.4 us">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d14"/>
      <stop offset="100%" stop-color="#0f1722"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#162130" stroke-width="0.75"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #e2e8f0; letter-spacing: 0.06em; }
      .subtitle { font-size: 13px; fill: #64748b; letter-spacing: 0.03em; }
      .tierTag { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
      .tierName { font-size: 16px; font-weight: 700; fill: #f1f5f9; }
      .hero { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
      .metric { font-size: 13px; font-weight: 600; }
      .body { font-size: 14px; fill: #cbd5e1; }
      .submono { font-size: 13px; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="960" height="250" rx="12" fill="url(#bgGrad)"/>
  <rect width="960" height="250" rx="12" fill="url(#grid)" opacity="0.65"/>
  <rect x="0.5" y="0.5" width="959" height="249" rx="12" fill="none" stroke="#1e293b"/>

  <!-- Header -->
  <text x="32" y="36" class="mono title">WHY THESE NUMBERS MATTER</text>
  <text x="32" y="57" class="mono subtitle">CONSUMER 8 GB VRAM + 96 MiB 3D V-CACHE BASELINE</text>
  <rect x="744" y="21" width="184" height="28" rx="5" fill="#0f2922" stroke="#10b981" stroke-width="1"/>
  <text x="836" y="40" text-anchor="middle" class="mono metric" fill="#34d399">EMPIRICAL RESULTS</text>

  <!-- Split Row: 2 x 436px boxes matching neural_hive_arch.svg -->
  <g transform="translate(32, 78)">
    <!-- Left Card: 35B MoE -->
    <rect width="436" height="144" rx="8" fill="#131c2b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="18" y="36" class="sans tierTag" fill="#38bdf8">35B MoE</text>
    <text x="418" y="36" text-anchor="end" class="sans hero" fill="#38bdf8">89.5 tok/s</text>

    <text x="18" y="66" class="sans tierName">8 GB VRAM + DDR5 Spillover</text>
    <text x="418" y="66" text-anchor="end" class="mono metric" fill="#7dd3fc">vs. 30–50 native</text>

    <text x="18" y="96" class="sans body">A 35B Q4 model (~20 GB) spills &gt;12 GB into RAM.</text>
    <text x="18" y="120" class="mono submono">vcache-run -c 2-7 + NTA stops L3 thrashing.</text>

    <!-- Right Card: 1M-Vector RAG -->
    <g transform="translate(460, 0)">
      <rect width="436" height="144" rx="8" fill="#11221c" stroke="#34d399" stroke-width="1.4"/>
      <text x="18" y="36" class="sans tierTag" fill="#34d399">1M / 10M RAG</text>
      <text x="418" y="36" text-anchor="end" class="sans hero" fill="#34d399">163 / 296 µs</text>

      <text x="18" y="66" class="sans tierName">L3 + RaBitQ VNNI (0% GPU)</text>
      <text x="418" y="66" text-anchor="end" class="mono metric" fill="#6ee7b7">6,144 / 3,313 QPS</text>

      <text x="18" y="96" class="sans body">1M in 96 MiB L3 (366 GB/s); 10M @ 0.938 Recall@10.</text>
      <text x="18" y="120" class="mono submono">AVX-512 VPOPCNTDQ + THP VPDPBUSD (DDR5-NTA).</text>
    </g>
  </g>
</svg>
