<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 222" width="960" height="222" role="img" aria-label="Benchmark Highlights: 35B MoE 76.3 tok/s and 1M-Vector RAG 162.8 us">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d14"/>
      <stop offset="100%" stop-color="#0f1722"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#162130" stroke-width="0.75"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
      .title { font-size: 15px; font-weight: 700; fill: #e2e8f0; letter-spacing: 0.08em; }
      .subtitle { font-size: 11px; fill: #64748b; letter-spacing: 0.04em; }
      .tierTag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
      .tierName { font-size: 14px; font-weight: 700; fill: #f1f5f9; }
      .hero { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
      .metric { font-size: 11px; font-weight: 600; }
      .body { font-size: 12px; fill: #94a3b8; }
      .submono { font-size: 11px; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="960" height="222" rx="12" fill="url(#bgGrad)"/>
  <rect width="960" height="222" rx="12" fill="url(#grid)" opacity="0.65"/>
  <rect x="0.5" y="0.5" width="959" height="221" rx="12" fill="none" stroke="#1e293b"/>

  <!-- Header -->
  <text x="32" y="34" class="mono title">WHY THESE NUMBERS MATTER</text>
  <text x="32" y="52" class="mono subtitle">CONSUMER 8 GB VRAM + 96 MiB 3D V-CACHE BASELINE</text>
  <rect x="760" y="22" width="168" height="24" rx="5" fill="#0f2922" stroke="#10b981" stroke-width="1"/>
  <text x="844" y="38" text-anchor="middle" class="mono metric" fill="#34d399">EMPIRICAL RESULTS</text>

  <!-- Split Row: 2 x 436px boxes matching neural_hive_arch.svg -->
  <g transform="translate(32, 74)">
    <!-- Left Card: 35B MoE -->
    <rect width="436" height="122" rx="8" fill="#131c2b" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="16" y="14" width="112" height="20" rx="4" fill="#0c2d48"/>
    <text x="72" y="28" text-anchor="middle" class="mono tierTag" fill="#38bdf8">35B MoE</text>
    <text x="418" y="30" text-anchor="end" class="sans hero" fill="#38bdf8">76.3 tok/s</text>

    <text x="16" y="56" class="sans tierName">8 GB VRAM + DDR5 Spillover</text>
    <text x="418" y="56" text-anchor="end" class="mono metric" fill="#7dd3fc">vs. 30–50 naive</text>

    <text x="16" y="82" class="sans body">A 35B Q4 model (~20 GB) spills &gt;12 GB into system RAM.</text>
    <text x="16" y="102" class="mono submono">vcache-run -c 2-7 + NTA keeps L3 clean &amp; fast.</text>

    <!-- Right Card: 1M-Vector RAG -->
    <g transform="translate(460, 0)">
      <rect width="436" height="122" rx="8" fill="#11221c" stroke="#34d399" stroke-width="1.4"/>
      <rect x="16" y="14" width="112" height="20" rx="4" fill="#0d3326"/>
      <text x="72" y="28" text-anchor="middle" class="mono tierTag" fill="#34d399">1M RAG</text>
      <text x="418" y="30" text-anchor="end" class="sans hero" fill="#34d399">162.8 µs</text>

      <text x="16" y="56" class="sans tierName">L3-Resident Vector Search (0% GPU)</text>
      <text x="418" y="56" text-anchor="end" class="mono metric" fill="#6ee7b7">10–50× vs. RAM</text>

      <text x="16" y="82" class="sans body">1M binary vectors (61 MiB) fit inside 96 MiB L3 cache.</text>
      <text x="16" y="102" class="mono submono">AVX-512 VPOPCNTDQ · 6,144 QPS · 366 GB/s.</text>
    </g>
  </g>
</svg>
